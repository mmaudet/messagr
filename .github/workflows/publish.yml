# Reaching real devices, through the real channel.
#
# Separate from ci.yml and device.yml because it is the only workflow that
# holds a signing key and the only one that talks to a shop. Both of those
# make it a workflow to run on purpose rather than on every push, which is
# why it is dispatched by hand and by nothing else.
#
# # Play App Signing, and which key this is
#
# Google Play holds the *app signing key*: the one an application's identity
# is permanently bound to, which cannot be replaced and whose loss would end
# the application. What lives in this repository's secrets is the *upload
# key*, which only proves a build came from us. That split is the whole point
# of enrolling: losing the upload key is a support request, not an ending.
#
# What to do if it is lost is written in docs/publishing-android.md, because
# the recoverable half is only recoverable if somebody knows how.
#
# This workflow does not make an application's first release. Not because the
# API is known to refuse one -- Google's documentation says nothing either way
# -- but because a first release needs a store listing, a content rating, a
# data safety form and target audience declarations, and the API fills in none
# of them.
name: Publish

on:
  workflow_dispatch:
    inputs:
      track:
        description: Which Play track to publish to
        required: true
        default: internal
        type: choice
        options: [internal, alpha]

jobs:
  internal-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yarn install --frozen-lockfile

      # Refused early and by name. Gradle would otherwise produce an unsigned
      # bundle and the upload would fail much later with a message about the
      # bundle rather than about the missing secret that caused it.
      - name: Assert the upload key is present
        env:
          KEYSTORE: ${{ secrets.MESSAGR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "MESSAGR_UPLOAD_KEYSTORE_BASE64 is not set." >&2
            echo "See docs/publishing-android.md: the upload key is created once, by hand, and never lives in this repository." >&2
            exit 1
          fi

      # Written to the runner's temporary directory, which is destroyed with
      # the runner. Never into the workspace, where a later step could archive
      # it into an artifact by accident.
      - name: Materialise the upload key
        env:
          KEYSTORE: ${{ secrets.MESSAGR_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      # A bundle rather than an APK: Play requires one, and it is what lets
      # the store sign and split per device.
      - name: Build the signed app bundle
        working-directory: packages/app/android
        env:
          # Offset well clear of anything uploaded by hand while the listing
          # was being set up, and monotonic afterwards because a run number
          # only goes up. Play refuses a code it has seen before, so this is
          # the field that must never repeat.
          MESSAGR_VERSION_CODE: ${{ 100 + github.run_number }}
          MESSAGR_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          MESSAGR_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MESSAGR_UPLOAD_KEYSTORE_PASSWORD }}
          MESSAGR_UPLOAD_KEY_ALIAS: ${{ secrets.MESSAGR_UPLOAD_KEY_ALIAS }}
          MESSAGR_UPLOAD_KEY_PASSWORD: ${{ secrets.MESSAGR_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      # Asserted rather than assumed: a bundle that reached Play unsigned
      # would be rejected there, with a message about the upload rather than
      # about the signature.
      # Asked of jarsigner rather than inferred from an entry name, and
      # without a pipe. `grep -q` closes the pipe at its first match, `unzip`
      # dies of SIGPIPE listing the rest of an eighty-megabyte archive, and a
      # shell with pipefail reads that as a failure -- intermittently, which
      # is worse than always. jarsigner's exit status is not the answer
      # either: it returns 0 for an unsigned jar, so the verdict is what it
      # says.
      - name: Assert the bundle is signed
        run: |
          bundle=packages/app/android/app/build/outputs/bundle/release/app-release.aab
          verdict="$(jarsigner -verify "$bundle" 2>&1 || true)"
          case "$verdict" in
            *"jar verified"*) echo "the bundle is signed" ;;
            *)
              echo "the bundle is not signed: ${verdict%%$'\n'*}" >&2
              exit 1
              ;;
          esac

      - name: Upload to the internal testing track
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.MESSAGR_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: eu.messagr
          releaseFiles: packages/app/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Keep the key out of anything that outlives this run
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
