name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --frozen-lockfile so a dependency that drifted from the lockfile fails
      # here rather than resolving to something nobody chose.
      - run: yarn install --frozen-lockfile

      # The crypto bridge ships prebuilt binaries and declares no install
      # script. This asserts that, rather than trusting it: a package that
      # started reaching for a compiler would otherwise be discovered on a
      # developer's machine instead of here.
      - name: Assert no dependency can invoke a compiler
        run: |
          node -e '
            const p = require("react-native-matrix-crypto/package.json")
            const hooks = ["preinstall", "install", "postinstall", "prepare"]
            const found = hooks.filter(h => p.scripts?.[h])
            if (found.length) {
              console.error("install hooks declared: " + found.join(", "))
              process.exit(1)
            }
          '

      # Before the lint, and that ordering carries the argument. The lint
      # refuses any design value written in place, which is only a rule worth
      # having if the module it points at still matches design/tokens.json.
      # A stale module would make the lint enforce yesterday's design very
      # strictly.
      # A shell mistake reached the device job once and cost a nine-minute
      # build to discover: a multi-line block written into a workflow arrived
      # at `sh` a line at a time and failed as an unterminated brace. Parsing
      # every script here is a second and catches that class outright.
      - name: Parse every shell script
        run: |
          for script in scripts/*.sh .githooks/* deploy/messagr-eu/*.sh \
                        deploy/messagr-eu/tests/*.sh; do
            [ -f "$script" ] || continue
            bash -n "$script" || { echo "$script does not parse" >&2; exit 1; }
          done
          echo "every shell script parses"

      - name: Assert the generated design tokens match their source
        run: yarn tokens:check

      # A changelog generator that got it wrong would produce a public
      # artefact nobody would think to doubt. It has no test file because
      # `scripts/` has no test harness; it carries its own cases instead, and
      # this is what makes them run.
      - name: Assert the release notes are built the way they are meant to be
        run: node scripts/release-notes.mjs --self-test

      # LE RELECTEUR D'APPLE N'ENTRE QUE SI CE SCRIPT DÉCIDE JUSTE, et il
      # tourne des jours sans personne devant. Qui inviter, quand s'arrêter :
      # des fonctions pures, exercées ici réseau coupé. Il relit aussi
      # `issueInvitation.ts` et `create.rs` : une conversation émise par le
      # script qui ne ressemblerait plus à celles de l'application échoue ici,
      # plutôt que devant la revue d'Apple.
      - name: Assert the reviewer's admission decides the way it is meant to
        run: node scripts/testflight-reviewer.mjs --self-test

      # LA TABLE DE TAILLES EST LA SEULE CHOSE QUE CE CONTRÔLE SAIT, et une
      # taille fautive s'y verrait pour la première fois dans App Store
      # Connect, après le téléversement -- c'est-à-dire à l'endroit exact où
      # on ne veut pas l'apprendre. Rien d'autre ne peut l'exercer : les
      # captures elles-mêmes demandent un simulateur, que ce runner n'a pas,
      # et `scripts/` n'a pas de harnais de tests. Le fichier porte donc ses
      # cas, comme `release-notes.mjs` et `testflight-reviewer.mjs` portent
      # les leurs, et ceci est ce qui les lance.
      - name: Assert the iOS screenshot sizes are the ones Apple accepts
        run: node scripts/assert-ios-captures.mjs --self-test

      - run: yarn lint
      - run: yarn format
      - run: yarn typecheck
      - run: yarn test

      # ADR-0001 allows one crypto implementation in the binary. matrix-js-sdk
      # brings a second, and Metro resolves it even though it is never called,
      # so the bundle is inspected rather than the intention trusted.
      - name: Assert the bundle carries no crypto WebAssembly module
        run: ./scripts/assert-no-crypto-wasm.sh

      # CE QUI ATTRAPE UN WORKFLOW QUI REFUSE DE DÉMARRER (#248).
      #
      # `publish.yml` a été rejeté AU DÉCLENCHEMENT pour un `+` dans une
      # expression : pas une étape en échec, un run qui ne commence jamais.
      # Rien ne le voyait, parce que ces fichiers ne tournent pas tous à
      # chaque poussée — `publish.yml` attend une main.
      #
      # LE TEST QUE CETTE GARDE A PASSÉ AVANT D'ÊTRE POSÉE : attrape-t-elle
      # SON incident ? Reproduit le 12 septembre 2026 avec
      # `${{ github.run_number + 1 }}`, et actionlint répond
      # « got unexpected character '+' while lexing expression ». Oui.
      #
      # Une analyse YAML, elle, ne l'aurait pas vu — le fichier était du YAML
      # parfaitement valide — et c'est pour ça qu'elle avait été écartée.
      #
      # LE BINAIRE EST ÉPINGLÉ ET VÉRIFIÉ, plutôt qu'une action tierce ou un
      # `curl | sh`. Une version qui flotte ferait dépendre la garde de ce que
      # GitHub sert le jour dit, et une action tierce est un tiers de plus
      # dans une chaîne que ce projet garde courte.
      #
      # UNE SEULE EXCEPTION, ET LE JOUR OÙ ELLE TOMBE. GitHub documente `queue`
      # dans la concurrence (`single` ou `max`) et l'accepte : le run Device
      # de #293 a démarré avec `queue: max` sur le job du banc. actionlint
      # 1.7.12, la dernière version publiée au 13 septembre 2026, ne connaît
      # que `group` et `cancel-in-progress`, et refuse la clé. `-ignore` retire
      # ce seul message et laisse passer tous les autres. À retirer dès
      # qu'une version d'actionlint connaît `queue`.
      - name: Assert every workflow would actually start
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLf --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" actionlint
          ./actionlint -ignore 'unexpected key "queue" for "concurrency" section'
          rm -f actionlint "$archive"

      # HERE, AND NOT IN THE macOS JOB. All three are files in this
      # repository, so a Linux runner reads them fine -- and the simulator
      # job cannot catch any of this: a simulator build proves compilation,
      # and an unentitled build compiles. It registers with Apple, is
      # refused, and reports nothing.
      #
      # LE SCRIPT PORTE AUSSI CE QUI NE DOIT PAS ARRIVER (#334) :
      # `FirebaseMessagingAutoInitEnabled` à `false` dans le même Info.plist.
      # Absente, la clé laisse le SDK retomber sur le réglage global de
      # collecte de Firebase, actif par défaut. Le nom de l'étape dit les
      # deux, parce qu'une étape nommée pour un seul de ses refus envoie la
      # personne qui la voit rouge lire le mauvais fichier.
      - name: Assert an iPhone built from this tree could be woken, and quietly
        run: ./scripts/assert-ios-push.sh

      # LE MÊME GENRE DE SILENCE, SUR LE PARTAGE ENTRANT (#242).
      # L'extension et l'application se remettent un fichier par un conteneur
      # d'App Group, nommé dans quatre fichiers. Une divergence d'un caractère
      # compile, se signe, s'installe -- et le partage disparaît sans erreur
      # ni journal : chacun ouvre un conteneur valide, et ce n'est pas le
      # même. Le job `ios-simulator` ne peut pas le voir, une build de
      # simulateur n'étant pas signée ; celui-ci lit quatre chaînes dans
      # quatre fichiers, ce qu'un runner Linux sait faire.
      - name: Assert the share extension and the app share one container
        run: ./scripts/assert-share-group.sh

      # THE SAME SHAPE OF FAILURE, ONE STEP LATER IN THE PIPELINE.
      # An empty AppIcon.appiconset builds, installs and runs; App Store
      # Connect is the first thing that refuses it, which is one round trip
      # into a manual upload. Found exactly that way on #109.
      - name: Assert the build carries an app icon
        run: ./scripts/assert-ios-icon.sh

      # THE THIRD OF THE SAME SHAPE, AND THE MOST EXPENSIVE SO FAR.
      # ITMS-90683 refused #109's first delivery an hour after `altool
      # --validate-app` had said VERIFY SUCCEEDED, by an email to an address
      # nobody was watching; 90592 refused the next one for a half-made export
      # declaration. Both are things the plist says, and both were invisible
      # until Apple said them.
      - name: Assert Info.plist says what App Store Connect requires
        run: ./scripts/assert-ios-info-plist.sh

      # LA MÊME FORME ENCORE, ET CELLE-CI, PERSONNE NE LA REFUSE.
      #
      # Les quatre textes d'autorisation vivaient en français dans un
      # Info.plist dont la région de développement est `en`, sans aucun
      # `.lproj` à côté : tout iPhone, quelle que soit sa langue, demandait le
      # micro en français (#320). Apple l'accepte, la build est verte, et la
      # seule personne à qui ça se voit tient un téléphone réglé en allemand
      # au moment où on lui demande son micro.
      #
      # Le script lit aussi le pbxproj, et c'est sa moitié silencieuse : un
      # `.lproj` qu'aucun groupe de variantes ne nomme, ou une région absente
      # de `knownRegions`, ne casse rien du tout et n'arrive jamais dans le
      # paquet. Le job `ios-simulator` prouve que le projet est bien formé,
      # pas ce qu'il y a dans les fichiers.
      - name: Assert the permission dialogs speak every language
        run: ./scripts/assert-ios-localisation.sh

      # THE FOURTH OF THE SAME SHAPE, AND THE FIRST THAT SPANS BOTH
      # PLATFORMS. The invitation page's button is meant to be intercepted by
      # the operating system, and was intercepted by neither: iOS had no
      # associated-domains entitlement at all, Android claimed no https link.
      # Reported from two devices within minutes of each other, and invisible
      # from any build.
      - name: Assert an invitation link opens the application
        run: ./scripts/assert-invitation-links.sh

      # LES DEUX FICHES DE MAGASIN, TENUES À LEURS LIMITES ICI ET PAS AILLEURS.
      #
      # `play-listing/check.py` existe depuis le début, et n'était appelé que
      # par `store-listing.yml`, qui attend une main (`workflow_dispatch`). Un
      # champ trop long s'y découvrait donc AU MOMENT D'ENVOYER, c'est-à-dire
      # après la revue, après la fusion, et devant un formulaire ouvert.
      #
      # La fiche App Store est pire, et c'est ce qui a fait déplacer les deux
      # ici : il n'y a pas d'API pour elle. L'`issuer id` et la clé `.p8`
      # d'App Store Connect vivent hors du dépôt, donc la fiche est recopiée à
      # la main dans la console. Il n'existe aucun « moment d'envoyer » où
      # quelque chose pourrait refuser. Ce job est le seul.
      #
      # `--self-test` en plus du contrôle : `check.py` se casse lui-même d'une
      # quinzaine de façons et exige un refus à chaque fois, pour le bon champ.
      # Un contrôleur qui n'a jamais refusé ne prouve rien, et celui-ci porte
      # la seule limite d'Apple qui ne se compte pas en caractères — les
      # mots-clés se comptent en OCTETS, et un `é` en coûte deux.
      #
      # `python3` est celui du runner : les deux scripts ne lisent que la
      # bibliothèque standard, et installer une version épinglée pour lire des
      # fichiers JSON coûterait plus que ça ne garantit.
      - name: Assert both store listings fit the stores' limits
        run: |
          python3 deploy/messagr-eu/play-listing/check.py
          python3 deploy/messagr-eu/app-store-listing/check.py
          python3 deploy/messagr-eu/app-store-listing/check.py --self-test

      # THE SITE, BUILT AND THEN CHECKED -- not the committed pages.
      #
      # `build-site.sh` exists because the substitution it performs used to
      # live in `deploy.sh`, where `sed` exits zero having substituted
      # nothing: a renamed slot served "the application is not published yet"
      # to everybody holding a working invitation, with a green deployment.
      # Running it here means the page a person would actually be served is
      # the page these tests read.
      #
      # The two properties the invitation page holds are the reason it is
      # written the way it is: its response is byte-identical for every token,
      # valid or not, so the page cannot reveal whether an invitation exists;
      # and it never claims the token itself.
      - name: Build the site and hold it to its own doctrine
        run: |
          rm -rf /tmp/messagr-site
          deploy/messagr-eu/build-site.sh deploy/messagr-eu/site /tmp/messagr-site
          for check in deploy/messagr-eu/tests/*.js; do
            echo "-- $(basename "$check")"
            node "$check"
          done
          # The live half wants the network and is not binding here; the
          # offline half reads the built tree and the vhost, and is.
          deploy/messagr-eu/tests/identical-page-invitation.sh \
            /tmp/messagr-site deploy/messagr-eu/nginx-messagr-eu.conf

      # The privacy policy against what the push gateway forwards. The live
      # half is binding only on a release; see the script.
      - name: Assert the privacy policy and the push gateway agree
        run: ./scripts/assert-push-payload.sh
