name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --frozen-lockfile so a dependency that drifted from the lockfile fails
      # here rather than resolving to something nobody chose.
      - run: yarn install --frozen-lockfile

      # The crypto bridge ships prebuilt binaries and declares no install
      # script. This asserts that, rather than trusting it: a package that
      # started reaching for a compiler would otherwise be discovered on a
      # developer's machine instead of here.
      - name: Assert no dependency can invoke a compiler
        run: |
          node -e '
            const p = require("react-native-matrix-crypto/package.json")
            const hooks = ["preinstall", "install", "postinstall", "prepare"]
            const found = hooks.filter(h => p.scripts?.[h])
            if (found.length) {
              console.error("install hooks declared: " + found.join(", "))
              process.exit(1)
            }
          '

      - run: yarn lint
      - run: yarn format
      - run: yarn typecheck
      - run: yarn test

      # ADR-0001 allows one crypto implementation in the binary. matrix-js-sdk
      # brings a second, and Metro resolves it even though it is never called,
      # so the bundle is inspected rather than the intention trusted.
      - name: Assert the bundle carries no crypto WebAssembly module
        run: ./scripts/assert-no-crypto-wasm.sh

  end-to-end:
    # The boot contract is a claim about a device, so it is asserted on one.
    # Android on an Ubuntu runner rather than iOS on macOS: same assertions,
    # a tenth of the billed minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yarn install --frozen-lockfile

      # Pure network calls against the bench homeserver: no emulator needed,
      # so this runs before one is booted and fails fast if the bench is
      # unreachable. MESSAGR_SESSION_* is what babel.config.js's
      # transform-inline-environment-variables bakes into the bundle two
      # steps down, so the names have to match what App.tsx reads.
      - name: Provision an account and export its session
        env:
          MESSAGR_BENCH_HOMESERVER: ${{ secrets.MESSAGR_BENCH_HOMESERVER }}
          MESSAGR_BENCH_TOKEN: ${{ secrets.MESSAGR_BENCH_TOKEN }}
        run: |
          ./scripts/provision-bench-accounts.sh
          python3 -c "
          import json
          d = json.load(open('/tmp/messagr-bench-accounts.json'))
          invitee = d['invitee']
          print('::add-mask::' + invitee['access_token'])
          with open('$GITHUB_ENV', 'a') as f:
              f.write(f'MESSAGR_SESSION_HOMESERVER={d[\"homeserver\"]}\n')
              f.write(f'MESSAGR_SESSION_USER_ID={invitee[\"user_id\"]}\n')
              f.write(f'MESSAGR_SESSION_DEVICE_ID={invitee[\"device_id\"]}\n')
              f.write(f'MESSAGR_SESSION_ACCESS_TOKEN={invitee[\"access_token\"]}\n')
          "

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the boot suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: messagr-e2e
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: packages/app
          script: |
            # The bundle is written into the APK rather than served, so no dev
            # server runs here. A backgrounded Metro would hold this step open
            # after the last command, and nothing would stop it.
            # git does not track an empty directory, so the bundle's
            # destination does not exist on a fresh checkout.
            mkdir -p android/app/src/main/assets
            npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
            npx detox build --configuration android.emu.debug
            npx detox test --configuration android.emu.debug
