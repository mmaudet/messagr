name: Device

# Everything below builds an APK or boots an emulator, so it runs only when
# something could actually change what a device does.
#
# `paths-ignore` rather than `paths`, deliberately: an allowlist silently
# stops testing a directory nobody remembered to add, and the failure is
# invisible until something ships broken. A denylist errs the other way --
# a new directory keeps the device suite running until somebody decides
# otherwise, which is the right default for a product whose correctness
# claim is cryptographic.
#
# What is listed here cannot reach a device: prose, design sources, and the
# spike fixture, which is built by hand and never by this workflow.
on:
  push:
    branches: [master]
    paths-ignore: &inert
      - 'docs/**'
      - 'design/**'
      - 'spikes/**'
      - '**/*.md'
  pull_request:
    paths-ignore: *inert

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    # The release build takes a different path through the toolchain than the
    # debug one the end-to-end job builds: it compiles the JavaScript ahead of
    # time with hermesc, which is the step #16 found broken -- and broken only
    # in release, so nothing else here would have caught it. No emulator and no
    # bench account: this asserts that the artifact can be produced and what it
    # contains, not how the app behaves.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yarn install --frozen-lockfile

      # Unsigned, and that is now the correct state rather than a gap. The
      # template signed release builds with the committed debug keystore,
      # which produces something that installs, looks finished, and can never
      # be published under this identity. This job asserts what the artifact
      # contains, which needs no signature; publishing is publish.yml's, and
      # it holds the only key that exists.
      - name: Build the release APK
        working-directory: packages/app/android
        run: ./gradlew :app:assembleRelease

      # hermesc runs on a different %OS-BIN% here than on a developer's mac,
      # so this is also where the derived path is proven portable.
      - name: Assert the release bundle is Hermes bytecode
        run: ./scripts/assert-hermes-bytecode.sh

  end-to-end:
    # The boot contract is a claim about a device, so it is asserted on one.
    # Android on an Ubuntu runner rather than iOS on macOS: same assertions,
    # a tenth of the billed minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yarn install --frozen-lockfile

      # Pure network calls against the bench homeserver: no emulator needed,
      # so this runs before one is booted and fails fast if the bench is
      # unreachable.
      #
      # It hands over an invitation LINK, not a session. The application
      # claims it on the device, which is what a real person does and what
      # the four build-time values used to stand in for.
      - name: Provision an invitation
        env:
          MESSAGR_BENCH_HOMESERVER: ${{ secrets.MESSAGR_BENCH_HOMESERVER }}
          MESSAGR_BENCH_TOKEN: ${{ secrets.MESSAGR_BENCH_TOKEN }}
        run: |
          ./scripts/provision-bench-accounts.sh
          python3 -c "
          import json, os
          d = json.load(open('/tmp/messagr-bench-accounts.json'))
          inviter = d['inviter']
          print('::add-mask::' + inviter['access_token'])
          print('::add-mask::' + inviter['password'])
          print('::add-mask::' + d['invitation_link'])
          print('::add-mask::' + d['roundtrip_invitation_link'])
          with open('$GITHUB_ENV', 'a') as f:
              f.write(f'MESSAGR_INVITATION_LINK={d[\"invitation_link\"]}\\n')
              # One per suite: an invitation is single-use and the harness
              # reinstalls the application between test files, so neither the
              # token nor the session it produces crosses that boundary.
              f.write(f'MESSAGR_ROUNDTRIP_INVITATION_LINK={d[\"roundtrip_invitation_link\"]}\\n')
              # The counterparty runs as the other account, the one that has a
              # password, and reads what the application's account sends.
              f.write(f'MESSAGR_INTEROP_HOMESERVER={d[\"homeserver\"]}\\n')
              f.write(f'MESSAGR_INTEROP_USER={inviter[\"user_id\"]}\\n')
              f.write(f'MESSAGR_INTEROP_PASSWORD={inviter[\"password\"]}\\n')
              f.write(f'MESSAGR_INTEROP_ROOM={d[\"room_id\"]}\\n')
              # The round-trip suite's account, not the boot suite's: this
              # step is the other half of that suite's exchange, and it is
              # that suite's send the counterparty is meant to read. With one
              # account the two readings coincided; with one per suite they
              # do not.
              f.write(f'MESSAGR_INTEROP_SENDER={d[\"roundtrip_entrant_user_id\"]}\\n')
              f.write(f'MESSAGR_INTEROP_WORKDIR={os.environ[\"RUNNER_TEMP\"]}/interop\\n')
          "

      # Before the emulator, and that ordering is the whole reason this is two
      # steps. Megolm shares a room key with the devices that exist when the
      # key is shared, so a counterparty that logs in after the application has
      # sent cannot decrypt anything -- and would look exactly like a protocol
      # disagreement rather than a race.
      - name: Log the independent counterparty in, before anything is sent
        run: |
          python3 -m pip install --quiet -r scripts/interop/requirements.txt
          python3 scripts/interop/nio_counterparty.py login

      # THE EMULATOR'S QEMU LINKS AGAINST libpulse AT LOAD TIME.
      #
      # The runner image stopped shipping it, and the failure reads as
      # anything but its cause: `emulator -version` fails, adb cannot reach a
      # daemon, and the suite reports every assertion failing against an
      # application that never started. Two runs were written off as an
      # unstable runner before the message was read.
      #
      # `-noaudio` is already passed and does not help: the library is
      # resolved when the binary loads, before any option is read.
      - name: Install the library the emulator links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          echo "libpulse0 present: $(ldconfig -p | grep -c libpulse.so.0) match(es)"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the boot suite on an emulator
        id: suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: messagr-e2e
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: packages/app
          script: |
            # The bundle is written into the APK rather than served, so no dev
            # server runs here. A backgrounded Metro would hold this step open
            # after the last command, and nothing would stop it.
            # git does not track an empty directory, so the bundle's
            # destination does not exist on a fresh checkout.
            mkdir -p android/app/src/main/assets
            npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
            npx detox build --configuration android.emu.debug
            ../../scripts/run-device-suite.sh

      # Only on failure, and that is the point: a green run's logs are noise,
      # while a red one without the device's own log costs a whole run per
      # hypothesis. The application says what it decided; this is how that
      # reaches whoever is reading the failure.
      # Conditioned on the suite itself having failed, not on the job having
      # failed. When something earlier goes wrong the suite never runs, there
      # are no artifacts to keep, and an empty upload erroring there shouts
      # about an absence that is entirely correct -- burying the failure that
      # actually happened under a second one that did not.
      - name: Keep the device's own logs when the suite fails
        # `hashFiles` is empty when nothing matched, which is how this asks
        # "is there anything to keep" without a shell step. The suite failing
        # is not enough on its own: it also fails when the build never
        # produced an app, and there are no device logs for a device that
        # never ran. `if-no-files-found: error` stays, so an upload that was
        # supposed to carry something and did not still says so.
        if: failure() && hashFiles('packages/app/.artifacts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: packages/app/.artifacts
          retention-days: 7
          # The directory is hidden, and this action skips hidden files by
          # default -- which is how the previous attempt uploaded nothing
          # while reporting success. The second silent failure of the same
          # instrument, for a different reason than the first.
          include-hidden-files: true
          # An error, not a warning: an instrument that reports success over
          # an empty directory is worse than no instrument, because it reads
          # as evidence that there was nothing to find.
          if-no-files-found: error

      # The acceptance criterion this whole job exists for: an independent
      # implementation, not ours, decrypting what the application encrypted.
      # Renamed with what it now proves. The application holds a
      # cross-signing identity, so it shares room keys only with devices an
      # identity vouches for -- and matrix-nio has no cross-signing at all.
      # This asserts the exclusion: the message must arrive and must stay
      # encrypted. The inbound direction, which the Detox suite covers, is
      # where the interoperability proof lives now. See #58.
      - name: Have the counterparty confirm it was excluded, as it should be
        env:
          MESSAGR_INTEROP_EXPECT: excluded
        run: python3 scripts/interop/nio_counterparty.py collect
