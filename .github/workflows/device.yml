name: Device

# Everything below builds an APK or boots an emulator, so it runs only when
# something could actually change what a device does.
#
# `paths-ignore` rather than `paths`, deliberately: an allowlist silently
# stops testing a directory nobody remembered to add, and the failure is
# invisible until something ships broken. A denylist errs the other way --
# a new directory keeps the device suite running until somebody decides
# otherwise, which is the right default for a product whose correctness
# claim is cryptographic.
#
# What is listed here cannot reach a device: prose, design sources, and the
# spike fixture, which is built by hand and never by this workflow.
on:
  push:
    branches: [master]
    paths-ignore: &inert
      - 'docs/**'
      - 'design/**'
      - 'spikes/**'
      - '**/*.md'
  pull_request:
    paths-ignore: *inert

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    # The release build takes a different path through the toolchain than the
    # debug one the end-to-end job builds: it compiles the JavaScript ahead of
    # time with hermesc, which is the step #16 found broken -- and broken only
    # in release, so nothing else here would have caught it. No emulator and no
    # bench account: this asserts that the artifact can be produced and what it
    # contains, not how the app behaves.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yarn install --frozen-lockfile

      # Unsigned, and that is now the correct state rather than a gap. The
      # template signed release builds with the committed debug keystore,
      # which produces something that installs, looks finished, and can never
      # be published under this identity. This job asserts what the artifact
      # contains, which needs no signature; publishing is publish.yml's, and
      # it holds the only key that exists.
      - name: Build the release APK
        working-directory: packages/app/android
        run: ./gradlew :app:assembleRelease

      # hermesc runs on a different %OS-BIN% here than on a developer's mac,
      # so this is also where the derived path is proven portable.
      - name: Assert the release bundle is Hermes bytecode
        run: ./scripts/assert-hermes-bytecode.sh

  ios-simulator:
    # WHY THIS JOB EXISTS, AND WHAT IT ALREADY WOULD HAVE CAUGHT.
    #
    # Android is built and exercised on every pull request; iOS was built by
    # nobody. That is not a theoretical gap: by the time it was noticed,
    # `Podfile.lock` knew neither of the two native dependencies added since
    # it was written, the only declared permission was a location one the
    # template left behind and nothing uses, and `Info.plist` had not been
    # valid XML since the URL scheme was added. None of it could fail, because
    # nothing ran.
    #
    # A simulator build rather than a device one: signing needs a certificate
    # this repository does not hold, and what has been going wrong is
    # compilation and configuration, which a simulator proves just as well.
    #
    # macOS runners cost roughly ten times a Linux minute, so this asserts
    # that the application builds and nothing more. Behaviour is the Android
    # end-to-end job's, and the platform-specific behaviour that only iOS can
    # answer for -- keychain accessibility above all -- needs a real locked
    # device and is not something a runner can hold.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Regenerated rather than trusted. A committed lock file that has fallen
      # behind `package.json` is exactly the failure this job is here for, and
      # `pod install` reconciling them silently would hide it -- so the lock is
      # checked afterwards for having moved.
      - name: Install the pods
        working-directory: packages/app/ios
        env:
          RCT_NEW_ARCH_ENABLED: '1'
        run: pod install

      # SPEC CHECKSUMS IS EXCLUDED, AND NOT AS A CONVENIENCE.
      #
      # The first run of this job failed on eighty checksums with an
      # unchanged dependency graph, on the same CocoaPods (1.17.0) as the
      # machine that wrote the lock. The reason is that a `SPEC CHECKSUMS`
      # entry is not the hash of the podspec: CocoaPods renders each spec to
      # `Pods/Local Podspecs/<name>.podspec.json` and hashes *that*, and the
      # rendering is not byte-reproducible across machines. Comparing them is
      # comparing two Ruby installations, which is not a fact about this
      # repository.
      #
      # What is a fact about this repository is everything above that
      # section: DEPENDENCIES, PODS with their versions, EXTERNAL SOURCES,
      # and `PODFILE CHECKSUM` -- which is a hash of the Podfile itself and
      # so is stable. A native dependency added to `package.json` and not
      # locked shows up there, which is the failure this job exists to catch.
      - name: Assert the pod lock was already in step with the manifest
        working-directory: packages/app/ios
        run: |
          graph() {
            sed '/^SPEC CHECKSUMS:/,/^PODFILE CHECKSUM:/ { /^PODFILE CHECKSUM:/!d; }' "$1"
          }
          git show HEAD:./Podfile.lock > /tmp/committed.lock
          graph /tmp/committed.lock > /tmp/committed.graph
          graph Podfile.lock > /tmp/installed.graph
          if ! diff -u /tmp/committed.graph /tmp/installed.graph > /tmp/graph.diff; then
            echo "Podfile.lock moved during install: it was behind package.json." >&2
            head -60 /tmp/graph.diff >&2
            exit 1
          fi

      # `plutil -lint` accepts what Apple's own lenient parser accepts, which
      # is how a comment containing `--` survived in there. Python's parser is
      # strict, and the file should be readable by any XML tool and not only
      # by Xcode.
      - name: Assert Info.plist is valid XML, strictly
        working-directory: packages/app/ios
        run: |
          plutil -lint Messagr/Info.plist
          python3 -c "import plistlib, sys; plistlib.load(open('Messagr/Info.plist','rb'))"

      # UN CYCLE NE FAIT PAS ROUGIR `xcodebuild`, ET C'EST LE PIÈGE.
      #
      # Mesuré le 12 septembre 2026 en ajoutant l'extension de partage
      # (#242) : la phase d'embarquement était posée après le script Firebase,
      # qui dépend de l'Info.plist, qui dépend de la copie. Xcode a écrit
      # « error: Cycle inside Messagr; building could produce unreliable
      # results », a laissé le PlugIns VIDE — donc une application livrée sans
      # son extension — et a rendu **le code 0**. Un job vert pour un artefact
      # amputé.
      #
      # Le journal est donc lu, puisque le code de sortie ne suffit pas. Les
      # avertissements ordinaires ne sont pas cherchés ici : ce filet nomme un
      # défaut précis, qui produit un binaire faux en silence.
      - name: Build for the simulator
        working-directory: packages/app/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Messagr.xcworkspace -scheme Messagr \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet build 2>&1 | tee /tmp/ios-build.log
          if grep -q 'Cycle inside' /tmp/ios-build.log; then
            echo '::error::le graphe de construction porte un cycle : ce que la build produit est incomplet, et xcodebuild rend quand même 0'
            grep -A6 'Cycle inside' /tmp/ios-build.log
            exit 1
          fi

  end-to-end:
    # The boot contract is a claim about a device, so it is asserted on one.
    # Android on an Ubuntu runner rather than iOS on macOS: same assertions,
    # a tenth of the billed minutes.
    #
    # UN SEUL BANC, DONC UNE SEULE SUITE À LA FOIS.
    #
    # La concurrence du workflow est par RÉFÉRENCE : deux branches ne
    # s'attendent pas. Tant que les poussées étaient espacées, personne ne
    # l'a vu. Le 12 septembre 2026, cinq branches poussées en onze minutes
    # ont produit cinq suites vivantes en même temps :
    #
    #     13:00 → 13:21     13:00 → 13:23     13:04 → 13:26
    #     13:07 → 13:28     13:11 → 13:32
    #
    # Les cinq ont échoué, master compris, sur #234 — « the counterparty's
    # message never decrypted ». Les sept runs du matin, espacés de vingt à
    # trente minutes et jamais recouvrants, étaient tous verts.
    #
    # ELLES PARTAGENT UN HOMESERVER. Chaque suite provisionne ses propres
    # comptes, mais toutes les créent, les font entrer et échangent leurs
    # clés sur la MÊME instance. Ce que cinq suites simultanées lui
    # demandent est un régime qu'elle n'avait jamais connu, et le découvrir
    # sous la forme d'un défaut de chiffrement coûte une journée de fausses
    # pistes — j'en ai écrit trois.
    #
    # LE GROUPE EST GLOBAL ET LA FILE N'ANNULE PAS. Au niveau du job, donc
    # `android-release` et `ios-simulator` continuent de tourner en
    # parallèle : eux ne touchent pas le banc. `cancel-in-progress: false`
    # parce qu'annuler une suite en cours pour en lancer une autre perdrait
    # vingt minutes de mesure ; ici on attend son tour.
    #
    # La concurrence par référence du workflow reste au-dessus : repousser
    # sur la même branche annule toujours la précédente, y compris quand
    # elle patiente dans cette file.
    concurrency:
      group: ${{ github.workflow }}-banc-unique
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yarn install --frozen-lockfile

      # Pure network calls against the bench homeserver: no emulator needed,
      # so this runs before one is booted and fails fast if the bench is
      # unreachable.
      #
      # It hands over an invitation LINK, not a session. The application
      # claims it on the device, which is what a real person does and what
      # the four build-time values used to stand in for.
      - name: Provision an invitation
        env:
          MESSAGR_BENCH_HOMESERVER: ${{ secrets.MESSAGR_BENCH_HOMESERVER }}
          MESSAGR_BENCH_TOKEN: ${{ secrets.MESSAGR_BENCH_TOKEN }}
        run: |
          ./scripts/provision-bench-accounts.sh
          python3 -c "
          import json, os
          d = json.load(open('/tmp/messagr-bench-accounts.json'))
          inviter = d['inviter']
          print('::add-mask::' + inviter['access_token'])
          print('::add-mask::' + inviter['password'])
          print('::add-mask::' + d['invitation_link'])
          print('::add-mask::' + d['roundtrip_invitation_link'])
          with open('$GITHUB_ENV', 'a') as f:
              f.write(f'MESSAGR_INVITATION_LINK={d[\"invitation_link\"]}\\n')
              # One per suite: an invitation is single-use and the harness
              # reinstalls the application between test files, so neither the
              # token nor the session it produces crosses that boundary.
              f.write(f'MESSAGR_ROUNDTRIP_INVITATION_LINK={d[\"roundtrip_invitation_link\"]}\\n')
              # The counterparty runs as the other account, the one that has a
              # password, and reads what the application's account sends.
              f.write(f'MESSAGR_INTEROP_HOMESERVER={d[\"homeserver\"]}\\n')
              # LE SERVICE, TRANSMIS PLUTÔT QUE REDÉRIVÉ. Voir
              # provision-bench-accounts.sh : la contrepartie le recalculait
              # et visait le homeserver sur un banc où les deux diffèrent.
              f.write(f'MESSAGR_INTEROP_SERVICE={d[\"service\"]}\\n')
              f.write(f'MESSAGR_INTEROP_USER={inviter[\"user_id\"]}\\n')
              f.write(f'MESSAGR_INTEROP_PASSWORD={inviter[\"password\"]}\\n')
              f.write(f'MESSAGR_INTEROP_ROOM={d[\"room_id\"]}\\n')
              # The round-trip suite's account, not the boot suite's: this
              # step is the other half of that suite's exchange, and it is
              # that suite's send the counterparty is meant to read. With one
              # account the two readings coincided; with one per suite they
              # do not.
              f.write(f'MESSAGR_INTEROP_SENDER={d[\"roundtrip_entrant_user_id\"]}\\n')
              f.write(f'MESSAGR_INTEROP_WORKDIR={os.environ[\"RUNNER_TEMP\"]}/interop\\n')
          "

      # Before the emulator, and that ordering is the whole reason this is two
      # steps. Megolm shares a room key with the devices that exist when the
      # key is shared, so a counterparty that logs in after the application has
      # sent cannot decrypt anything -- and would look exactly like a protocol
      # disagreement rather than a race.
      - name: Log the independent counterparty in, before anything is sent
        run: |
          python3 -m pip install --quiet -r scripts/interop/requirements.txt
          python3 scripts/interop/nio_counterparty.py login

      # THE EMULATOR'S QEMU LINKS AGAINST libpulse AT LOAD TIME.
      #
      # The runner image stopped shipping it, and the failure reads as
      # anything but its cause: `emulator -version` fails, adb cannot reach a
      # daemon, and the suite reports every assertion failing against an
      # application that never started. Two runs were written off as an
      # unstable runner before the message was read.
      #
      # `-noaudio` is already passed and does not help: the library is
      # resolved when the binary loads, before any option is read.
      - name: Install the library the emulator links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          echo "libpulse0 present: $(ldconfig -p | grep -c libpulse.so.0) match(es)"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the boot suite on an emulator
        id: suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: messagr-e2e
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: packages/app
          script: |
            # The bundle is written into the APK rather than served, so no dev
            # server runs here. A backgrounded Metro would hold this step open
            # after the last command, and nothing would stop it.
            # git does not track an empty directory, so the bundle's
            # destination does not exist on a fresh checkout.
            mkdir -p android/app/src/main/assets
            # THE FLAG BELONGS ON THIS COMMAND, WHICH IS THE ONE THAT BUNDLES.
            #
            # It was on `detox build` underneath, and the debug variant does
            # not bundle -- the react gradle plugin skips it, which is why
            # this line exists at all. So the APK packaged the asset built
            # HERE, without the flag, and the probe was compiled out of every
            # end-to-end run. `babel.config.js` says what the other half of
            # that bug was.
            MESSAGR_SEND_PROBE=1 npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
            # THE LAUNCH PROBE, ON HERE AND NOWHERE ELSE.
            #
            # It encrypts a message, puts it in a room and reads it back --
            # the end-to-end proof this suite asserts on. It is off in an
            # ordinary build because on 7 September 2026 a tester joined by
            # invitation, the bench room became a conversation with a person
            # in it, and he watched "encrypted by the bridge, sent by the
            # application" appear in his chat at every launch.
            #
            # `process.env.MESSAGR_SEND_PROBE` is inlined by
            # `babel.config.js`, so it belongs on the command that runs
            # Babel -- the bundle above, not this one.
            npx detox build --configuration android.emu.debug
            MESSAGR_CAPTURE_STORE=1 ../../scripts/run-device-suite.sh

      # Only on failure, and that is the point: a green run's logs are noise,
      # while a red one without the device's own log costs a whole run per
      # hypothesis. The application says what it decided; this is how that
      # reaches whoever is reading the failure.
      # The listing's screenshots, taken from the run that just proved the
      # application works. Kept whether or not anything failed, because a
      # green run is exactly when they are worth having.
      - name: Keep the store screenshots
        if: always() && hashFiles('store-screenshots/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: store-screenshots
          retention-days: 30

      # Conditioned on the suite itself having failed, not on the job having
      # failed. When something earlier goes wrong the suite never runs, there
      # are no artifacts to keep, and an empty upload erroring there shouts
      # about an absence that is entirely correct -- burying the failure that
      # actually happened under a second one that did not.
      - name: Keep the device's own logs when the suite fails
        # `hashFiles` is empty when nothing matched, which is how this asks
        # "is there anything to keep" without a shell step. The suite failing
        # is not enough on its own: it also fails when the build never
        # produced an app, and there are no device logs for a device that
        # never ran. `if-no-files-found: error` stays, so an upload that was
        # supposed to carry something and did not still says so.
        if: failure() && hashFiles('packages/app/.artifacts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: packages/app/.artifacts
          retention-days: 7
          # The directory is hidden, and this action skips hidden files by
          # default -- which is how the previous attempt uploaded nothing
          # while reporting success. The second silent failure of the same
          # instrument, for a different reason than the first.
          include-hidden-files: true
          # An error, not a warning: an instrument that reports success over
          # an empty directory is worse than no instrument, because it reads
          # as evidence that there was nothing to find.
          if-no-files-found: error

      # The acceptance criterion this whole job exists for: an independent
      # implementation, not ours, decrypting what the application encrypted.
      # Renamed with what it now proves. The application holds a
      # cross-signing identity, so it shares room keys only with devices an
      # identity vouches for -- and matrix-nio has no cross-signing at all.
      # This asserts the exclusion: the message must arrive and must stay
      # encrypted. The inbound direction, which the Detox suite covers, is
      # where the interoperability proof lives now. See #58.
      - name: Have the counterparty confirm it was excluded, as it should be
        env:
          MESSAGR_INTEROP_EXPECT: excluded
        run: python3 scripts/interop/nio_counterparty.py collect
