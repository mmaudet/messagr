<!--
  LA COPIE D'ÉCRAN DU HERO, ET CE QUI EN A ÉTÉ RETIRÉ.

  Ce n'est PAS une photographie d'une application qui tourne : c'est l'écran
  « conversation en tête-à-tête » du prototype de conception, extrait de
  `design/prototype/messagr-prototype-v3.html`, qui fait autorité sur la
  disposition (`design/prototype/lisez-moi.md`). Le jour où un banc peut
  photographier un état de produit (#157), elle est remplacée par la vraie.

  QUATRE CHOSES ONT ÉTÉ ENLEVÉES, ET CHACUNE PARCE QU'ELLE NE TOURNE PAS :

    - les deux boutons d'appel de l'en-tête, alors que #88 et #89 sont ouverts ;
    - le message vocal, alors que `composer_record` existe mais que le micro du
      composeur est teinté en `neutral.300`, la paire désactivée ;
    - la vignette photographique, un `<image-slot>` du moteur de canvas qui ne
      rend rien ici et qui pointait vers picsum.photos, donc hors origine ;
    - la légende « Regarde la deuxième » et le séparateur « Aujourd'hui », qui
      n'annonçaient plus rien une fois la photographie partie.

  CE QUI RESTE EST ENTIÈREMENT LIVRÉ : la conversation en tête-à-tête, les
  horodatages, la double coche, l'indicateur de frappe, le composeur, et les
  deux plis de coin qui distinguent ce produit au premier regard.

  Les trois marques sont remplies par langue. Une conversation française sur
  /de/ annulerait ce que les six adresses corrigent, et « Hier » s'y lirait
  « ici ».

  Pour refaire les images :
      node deploy/messagr-eu/landing/rendre-conversation.mjs
-->
