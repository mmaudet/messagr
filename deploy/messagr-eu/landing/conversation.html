<!doctype html>
<!--
  LE DÉTAIL DE CONVERSATION DU HERO, ET D'OÙ IL VIENT.

  Ce n'est PAS une photographie de l'application : c'est l'écran « conversation
  en tête-à-tête » du prototype de conception, extrait de
  `design/prototype/messagr-prototype-v3.html`, qui fait autorité sur la
  disposition (voir `design/prototype/lisez-moi.md`). Le jour où un banc peut
  photographier l'application dans un état de produit (#157), cette image est
  remplacée par la vraie.

  POURQUOI UN DÉTAIL ET PAS L'ÉCRAN ENTIER. L'écran complet du prototype montre
  trois choses que l'application ne fait pas encore, et les mettre sur une page
  de promotion serait annoncer ce qui ne tourne pas :

    - deux boutons d'appel en en-tête, alors que #88 et #89 sont ouverts ;
    - un message vocal, alors que `composer_record` existe mais que le micro
      du composeur est teinté en `neutral.300`, l'état désactivé ;
    - une vignette photographique, qui reste vide ici parce que
      `image-slot.js` n'est pas versionné.

  Ce qui reste est entièrement livré : la conversation en tête-à-tête, les
  horodatages, la double coche, et les deux plis de coin de la marque.

  LE TEXTE EST REMPLACÉ PAR LANGUE. Une conversation française sur /de/
  annulerait ce que les six adresses corrigent. Les deux phrases sont des
  marques, et `landing/rendre-conversation.mjs` les remplit.

  Pour refaire les images :
      node deploy/messagr-eu/landing/rendre-conversation.mjs
-->
