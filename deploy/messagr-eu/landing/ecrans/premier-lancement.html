<!doctype html><meta charset="utf-8"><body style="margin:0;background:#F7F5EF">
<!--ENLEVES {{ p.label }}-->
<style>
  body { margin:0; background:#e8e4dc; color:#1b1a19; font-family:'Schibsted Grotesk', Helvetica, sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#0e8f63; text-decoration:none; }
  a:hover { color:#06614a; text-decoration:underline; }
  * { box-sizing:border-box; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:#cfc8bb; border-radius:3px; }
  @keyframes riseIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  @keyframes pulseRing { 0%{opacity:.25} 50%{opacity:.9} 100%{opacity:.25} }
  @keyframes scanSweep { 0%{transform:translateY(-104px)} 100%{transform:translateY(104px)} }
</style>
<sc-if value="{{ isSplash }}" hint-placeholder-val="{{ false }}">
              <div style="flex:1; background:#0c1f19; color:#f2fbf6; font-family:'Schibsted Grotesk', Helvetica, sans-serif; display:flex; flex-direction:column; justify-content:space-between; padding:44px 30px 34px; position:relative; overflow:hidden;">
                <div style="position:absolute; inset:-40% -30% auto; height:70%; background:radial-gradient(closest-side, rgba(18,183,106,.22), transparent);"></div>

                <div style="display:flex; flex-direction:column; align-items:center; gap:18px; margin-top:34px; position:relative; animation:riseIn .5s ease both;">
                  <span style="color:#12b76a;">
                    <svg viewBox="0 0 100 100" width="72" height="72" style="display:block;">
                      <path d="M 30 12 H 70 A 18 18 0 0 1 88 30 V 70 A 18 18 0 0 1 70 88 H 30 A 18 18 0 0 1 12 70 V 30 A 18 18 0 0 1 30 12 Z M 54 12 L 88 46 L 88 58 L 42 12 Z M 36 72 V 36 H 46 V 43 A 15 15 0 0 1 61 36 V 47 A 7 7 0 0 0 46 52 V 72 Z" fill="currentColor" fill-rule="evenodd"></path>
                    </svg>
                  </span>
                  <span style="font-size:36px; font-weight:600; letter-spacing:-0.03em; color:#f2fbf6; display:inline-flex; align-items:baseline;">
                    <span style="display:inline-block; clip-path:polygon(0 0, 100% 0, 100% 0.27em, calc(100% - 0.108em) 0.27em, 100% 0.378em, 100% 100%, 0 100%);">M</span><span>essag</span><span style="display:inline-block; clip-path:polygon(0 0, 100% 0, 100% 0.27em, calc(100% - 0.108em) 0.27em, 100% 0.378em, 100% 100%, 0 100%);">r</span>
                  </span>
                </div>

                <div style="position:relative; display:flex; flex-direction:column; gap:22px; margin-top:40px; animation:riseIn .5s ease .18s both;">
                  <h1 style="margin:0; font-size:26px; line-height:1.22; font-weight:600; letter-spacing:-0.025em; text-wrap:pretty;">La messagerie qui ne vous demande rien.</h1>
                  <p style="margin:0; font-size:14.5px; line-height:1.55; color:rgba(242,251,246,.66); text-wrap:pretty;">Pas de numéro, pas de compte, pas de mot de passe. Quelqu'un vous invite, vous écrivez.</p>
                  
                </div>

                <div style="position:relative; display:flex; flex-direction:column; gap:14px; animation:riseIn .5s ease .32s both;">
                  <button onclick="{{ goPlain }}" style="width:100%; background:#12b76a; color:#0c1f19; border:none; clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); padding:16px 24px; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer;">Commencer</button>
                </div>
              </div>
            </sc-if>
</body>
