# messagr.eu — the product's DEFINITIVE domain.
#
# This name is engraved in EVERY user and room identifier, forever:
# `@alice:messagr.eu`. A homeserver is never renamed. Changing the machine
# behind this name is invisible; changing this name would orphan every
# account and every room, with their encrypted history.
#
# WORKING COPY OF THE SERVER'S FILE, imported into the repository on
# 9 August 2026: until now the file lived only on hermes
# (/etc/nginx/sites-available/messagr-eu), and a configuration that exists
# on a single machine is a configuration lost in advance. This file is now
# the source; the server receives its changes through
# deploy/messagr-eu/deploy.sh, which backs up before replacing.
#
# ═══ THE ORDER OF THE `location` BLOCKS CARRIES A PROPERTY, NOT A TASTE ═══
#
# The domain serves THREE things, and a single splitting mistake silently
# breaks one of them:
#
#   /.well-known/acme-challenge/  → certbot        (TLS renewal)
#   /.well-known/matrix/          → the homeserver (Matrix discovery)
#   /_matrix/                     → the homeserver (the Matrix API)
#   /                             → the site       (the presentation)
#
# NEVER RELAY `/.well-known/` AS A BLOCK to the homeserver. The ACME
# challenge lives there too, and renewal would stop — not at install time,
# but SIXTY DAYS LATER, when the certificate expires. The `^~` below makes
# this precedence explicit rather than dependent on writing order.
server {
    listen 80;
    listen [::]:80;
    server_name messagr.eu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-messagr-eu;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # ═══ `http2` SUR LES DEUX, ET L'AVERTISSEMENT QUE CELA PRODUIT ═══════
    #
    # Le rechargement du 7 septembre 2026 a écrit :
    #
    #   [warn] protocol options redefined for [::]:443 in
    #          /etc/nginx/sites-enabled/messagr-eu:45
    #
    # Ce n'est pas un défaut de ce fichier. hermes héberge trente et un autres
    # vhosts, et les options de protocole valent PAR SOCKET, pas par serveur :
    # le premier bloc lu pour une adresse donnée les fixe pour tous. Sur
    # `0.0.0.0:443` c'est ce fichier qui arrive en premier, donc HTTP/2 s'y
    # applique -- vérifié, `curl` obtient HTTP/2. Sur `[::]:443` un autre vhost
    # avait déjà fixé les options sans HTTP/2, et nginx le signale.
    #
    # LA LIGNE RESTE, ET C'EST DÉLIBÉRÉ. La retirer ferait taire
    # l'avertissement en abandonnant une capacité que ce site demande
    # légitimement ; le jour où le vhost qui arrive avant est corrigé, ou le
    # jour où hermes passe en nginx 1.25 où `http2 on;` vaut par serveur,
    # celui-ci n'aura rien à changer. L'avertissement documente une contrainte
    # de la machine, pas une erreur d'ici.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name messagr.eu;

    ssl_certificate     /etc/letsencrypt/live/messagr.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messagr.eu/privkey.pem;

    # ═══ LES QUATRE EN-TÊTES, ET LA RÈGLE D'HÉRITAGE QUI LES RÉPÈTE ═══════
    #
    # `add_header` ne descend d'un niveau QUE si le niveau du dessous n'en
    # déclare aucun. Six `location` d'ici portent déjà un `Cache-Control`, donc
    # posés seulement ici ils ne s'appliqueraient pas là où ils comptent le
    # plus -- la page d'invitation, l'APK, les déclarations d'app-links. Ils
    # sont donc répétés, et `tests/entetes-vhost.js` vérifie qu'aucun bloc n'en
    # manque : la répétition devient une propriété tenue, pas une discipline.
    #
    # HSTS SANS `includeSubDomains`, ET C'EST DÉLIBÉRÉ. La directive
    # engagerait tout sous-domaine de messagr.eu pour un an, y compris ceux
    # qui n'existent pas encore et celui qui serait un jour servi en clair par
    # erreur. Un an est long et une erreur y est irréversible côté navigateur.
    #
    # LA POLITIQUE DE CONTENU DIT CE QUE LA PAGE FAIT, ET RIEN DE PLUS : ses
    # propres images, ses styles et son script en ligne, aucune connexion.
    # C'est ce qui rend vérifiable la phrase du bloc éditeur, « ce site ne
    # mesure rien » : ce n'est plus une promesse, c'est le navigateur qui
    # l'applique.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # The body of a media or an attachment goes through here.
    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-messagr-eu;
    }

    # ═══ THE iOS UNIVERSAL LINKS (AASA) ═══
    #
    # Three properties, each already paid for elsewhere in the Apple
    # ecosystem: NO redirection (a redirection breaks iOS universal links
    # silently, and nothing reports it), NO .json extension (the file name
    # IS apple-app-site-association), served as application/json. The exact
    # location (`=`) guarantees all three, independently of any other block.
    #
    # iOS caches this file on the device: a wrong content served once stays
    # wrong for a while. Never put a placeholder value in it.
    location = /.well-known/apple-app-site-association {
        root /var/www/messagr-eu-site;
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store";
    }

    # ═══ THE ANDROID APP LINKS (assetlinks) ═══
    #
    # The catch-all `location /` ALREADY serves this file: its path matches
    # neither /.well-known/matrix/ nor the acme block, so it falls through to
    # the site root, where deploy.sh puts it. This block does not fix a 404 —
    # it buys the GUARANTEE the AASA above has: a pinned content type and no
    # cache, instead of a dependence on mime.types and on no future block ever
    # shadowing the path.
    #
    # Android re-verifies on install and on update. A wrong content served
    # once breaks autoVerify, and nothing reports it.
    location = /.well-known/assetlinks.json {
        root /var/www/messagr-eu-site;
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store";
    }

    # ═══ THE DIRECT DOWNLOAD, WHICH EXISTS BECAUSE NO STORE DOES ═══
    #
    # The first person to try the application is meant to have it BEFORE it
    # is published anywhere. Without this the invitation page can only say
    # "ask the person who invited you", which is honest and useless.
    #
    # `types { }` AND `default_type` TOGETHER, and not default_type alone.
    # default_type applies only when the type is otherwise unknown, and
    # whether .apk is in mime.types depends on the nginx package. Emptying
    # the type table for this one location makes the answer the same on
    # every host: an .apk served as text/plain is opened by some Android
    # browsers as a page instead of an install.
    #
    # No `try_files`: an absent file must be a plain 404 here. deploy.sh
    # refuses to serve a page offering a download the server does not have,
    # and this location is where that 404 would be measured.
    location = /messagr.apk {
        root /var/www/messagr-eu-site;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Disposition 'attachment; filename="messagr.apk"';
        add_header Cache-Control "no-store";
    }

    location /.well-known/matrix/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
    }

    location /_matrix/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The long-poll sync holds the connection open.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ═══ THE INVITATION LINKS, /i/ ═══
    #
    # A SINGLE static page for EVERY token: valid, revoked, expired or
    # made up, the answer is identical — no existence oracle, by
    # construction and not by discipline. The page never asks for the token
    # itself: it opens the application or explains how to get it, and the
    # token never travels through the browser.
    location /i/ {
        root /var/www/messagr-eu-site;
        try_files $uri /i/index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store";
    }

    # THE SHORTER FORM, `/i#<payload>`, WHICH THE COMPACT PAYLOAD WILL USE.
    #
    # A fragment NEVER reaches this server — not nginx, not its log, not an
    # intermediary. The path asked for is bare `/i`, which `location /i/` does
    # not cover: without this exact match the shorter form is a 404.
    #
    # Added on 11 August 2026, BEFORE the payload moves, so the day it moves
    # nothing has to be deployed in a hurry. `location /i/` stays for as long
    # as links in the old form circulate.
    location = /i {
        root /var/www/messagr-eu-site;
        try_files /i/index.html =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store";
    }

    # ═══ THE INVITATION SERVICE ═══
    #
    # Added on 8 August 2026. `https://messagr.eu` is the trusted origin
    # engraved in the core; as long as this service was not published HERE,
    # an issued QR pointed at a 404 address and nobody could claim it.
    #
    # 8095 and not 8090: 8090 is the PROTOTYPE's service. The two instances
    # each have their own service, their own database and their own
    # encryption key.
    #
    # The trailing slash of `proxy_pass` strips the prefix:
    # /_messagr/health reaches /health on the service side. The prefix
    # avoids the collision with the homeserver's namespace, which /health
    # would be part of at the root.
    location /_messagr/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # POST /invitations creates up to ten accounts in a row, each
        # through two UIA round trips. nginx's 60 s default would cut the
        # request WHILE accounts are being created, and a localpart is
        # never released: those accounts would stay orphaned.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # The responses carry secrets in the clear: invitation token,
        # password and access token of the handed-over account. No cache,
        # anywhere.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        proxy_buffering off;
    }

    # The presentation site. Empty for now, and that is deliberate: the
    # root belongs to the site, not to the homeserver.
    location / {
        # ── CACHE-CONTROL PAR NATURE, ET LES TROIS QUI DOIVENT SUIVRE ─────
        #
        # `no-cache` ne veut pas dire « ne garde rien » : il veut dire « garde,
        # mais revalide ». Avec l'ETag que nginx pose déjà, une page inchangée
        # coûte un 304 et rien d'autre, et une page redéployée est vue tout de
        # suite. C'est ce qu'il faut ici : les noms de fichiers ne portent
        # aucune empreinte, donc `messagr-conversation-de.png` change de
        # contenu sans changer d'adresse, et un `max-age` servirait l'ancienne
        # image pendant sa durée.
        #
        # LES TROIS EN-TÊTES DE SÉCURITÉ SONT REPOSÉS ICI, et ce n'est pas une
        # redondance : déclarer un `add_header` dans ce bloc lui fait perdre
        # TOUS ceux du serveur. C'est la règle d'héritage de nginx, et c'est
        # exactement le piège que `tests/entetes-vhost.js` refuse désormais.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        root /var/www/messagr-eu-site;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
