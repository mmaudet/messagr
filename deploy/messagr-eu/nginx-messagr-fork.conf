# Messagr — vhost de la TROISIÈME instance, celle qui fait tourner notre fork.
#
# ═══ CE FICHIER N'EXISTAIT QUE SUR LE SERVEUR ═══
#
# Il a vécu sur hermes seul jusqu'au 7 septembre 2026, et ce jour-là il a
# fallu le modifier : un vhost qu'aucun dépôt ne porte est un vhost dont
# personne ne peut lire l'histoire, ni comparer l'état servi à un état
# attendu. `nginx-messagr-eu.conf` était déjà ici ; celui-ci l'y rejoint.
#
# Il n'est PAS déployé par `deploy.sh`, qui ne connaît que messagr.eu :
# l'installer se fait à la main, avec une sauvegarde datée, `nginx -t`, puis
# un rechargement — la même discipline que ce script applique à l'autre.
#
# Déployé sur hermes en /etc/nginx/sites-available/messagr-fork, lié depuis
# sites-enabled. messagr-fork.maudet.cloud a un enregistrement A explicite vers
# hermes (204.168.196.226), comme messagr.maudet.cloud : le wildcard
# *.maudet.cloud pointe vers vps et ne conviendrait pas.

server {
    listen 80;
    listen [::]:80;
    server_name messagr-fork.maudet.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name messagr-fork.maudet.cloud;

    ssl_certificate     /etc/letsencrypt/live/messagr-fork.maudet.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messagr-fork.maudet.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # PAS de /callback. Le service d'invitation, lui, existe desormais.
    #
    # Ce bloc a longtemps refuse les deux, et pour une raison juste : brancher
    # /_messagr/ ici l'aurait relie au service du PROTOTYPE, sur 127.0.0.1:8090,
    # qui aurait donc cree des comptes sur le prototype en reponse a des appels
    # recus sous le nom du banc. Deux domaines, un seul graphe de tracabilite,
    # et personne pour s'en apercevoir avant longtemps.
    #
    # Ce n'est plus le cas. Le banc a MAINTENANT son propre service, declare
    # dans son propre projet compose et joignable sur 8096. Il ne peut pas
    # atteindre le prototype : le homeserver ne publie son port que sur la
    # boucle locale de l'hote, qu'aucun conteneur n'atteint, donc seul un
    # service du meme projet le joint par son nom. Verifie plutot que suppose :
    # depuis ce conteneur, continuwuity-fork resout vers le banc, et le nom du
    # prototype ne resout pas du tout.
    location /_messagr/ {
        # 8096 : 8090 est le prototype, 8095 la production. Une erreur d'un
        # chiffre ici ferait exactement ce que le paragraphe ci-dessus decrit.
        proxy_pass http://127.0.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ═══ LA MOITIÉ WEB DE L'INVITATION, AJOUTÉE LE 7 SEPTEMBRE 2026 ═══
    #
    # POURQUOI ELLE MANQUAIT, ET POURQUOI C'EST DEVENU VISIBLE. Le lien
    # d'invitation nomme l'INSTANCE : son hôte est le homeserver du compte
    # qui invite, ce qui permet à l'invité d'entrer sans qu'on lui demande
    # quel serveur il rejoint. Sur ce banc, l'hôte est donc celui-ci — et ce
    # vhost ne servait que Matrix. Tant que le lien était `messagr://`, cela
    # ne se voyait pas : aucun navigateur ne l'ouvrait. Depuis qu'il est
    # `https://`, une caméra l'ouvre et tombait sur un 404.
    #
    # LE MÊME DOSSIER QUE messagr.eu, ET C'EST LA PROPRIÉTÉ QUI COMPTE.
    # `assetlinks.json` et l'AASA déclarent une APPLICATION, pas un serveur :
    # deux copies pourraient diverger, et une divergence ici casse la
    # vérification des liens sur une moitié du parc sans rien dire. Un seul
    # dossier ne le peut pas. `build-site.sh` ne substitue que les adresses
    # de téléchargement, dont aucune ne nomme l'instance.
    #
    # L'ORDRE EST LA PROPRIÉTÉ. Les deux `=` l'emportent sur tout, y compris
    # sur le `location /` qui suit : la découverte Matrix
    # (/.well-known/matrix/) continue donc d'aller au homeserver, ce qu'elle
    # doit. Se tromper ici casserait la fédération sans casser les liens,
    # c'est-à-dire de la manière la plus longue à remarquer.
    location = /.well-known/apple-app-site-association {
        root /var/www/messagr-eu-site;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location = /.well-known/assetlinks.json {
        root /var/www/messagr-eu-site;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Une SEULE page pour TOUT jeton — valide, révoqué, expiré ou inventé :
    # la réponse est identique, par construction et non par discipline. Le
    # jeton ne traverse jamais le navigateur.
    location /i/ {
        root /var/www/messagr-eu-site;
        try_files $uri /i/index.html;
        add_header Cache-Control "no-store";
    }

    # La forme courte `/i#<charge>` : le chemin demandé est `/i` tout court,
    # que `location /i/` ne couvre pas.
    location = /i {
        root /var/www/messagr-eu-site;
        try_files /i/index.html =404;
        add_header Cache-Control "no-store";
    }

    # La page ci-dessus propose ce téléchargement. Ne pas le servir ici
    # ferait une offre cassée sur ce banc et seulement sur lui.
    location = /messagr.apk {
        root /var/www/messagr-eu-site;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="messagr.apk"';
        add_header Cache-Control "no-store";
    }

    location / {
        # 8093 : le port du fork. 8008 est le prototype. Se tromper d'un
        # chiffre ici ferait répondre le prototype sous le nom du fork, et
        # toute mesure prise ensuite serait attribuée au mauvais serveur.
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # /sync est du long-polling : ne pas couper avant le timeout client.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
