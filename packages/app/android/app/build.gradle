apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
// The defaults in the block below assume ../../node_modules, which in a yarn
// workspace is not where these live. Resolved by the shared helper.
def nodeModuleDir = { String name -> new File(gradle.ext.nodeModules, name) }

react {
    reactNativeDir = nodeModuleDir("react-native")
    codegenDir = nodeModuleDir("@react-native/codegen")
    cliFile = new File(nodeModuleDir("react-native"), "cli.js")
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    // hermesc does not ship inside the react-native package any more: it is
    // its own npm package, `hermes-compiler`, and the plugin does know that
    // (HERMES_COMPILER_NPM_DIR, in its own PathUtils.kt). What it cannot know
    // is where node_modules is: it looks under `root`, which defaults to
    // packages/app, and a yarn workspace hoists node_modules to the monorepo
    // root instead. So the plugin looks in a directory this layout never
    // fills, and the error it raises names the older sdks/hermesc path that
    // no longer exists for anyone.
    //
    // Setting `root` to the monorepo would fix that one lookup and break
    // three others: `root` is also where the plugin looks for the entry file
    // (index.js lives in packages/app, not at the monorepo root), the working
    // directory it runs the bundler from, and the file tree it scans to decide
    // whether the bundle is up to date -- which at the monorepo root would
    // sweep every sibling workspace package (node_modules itself the task
    // already excludes). Naming hermesc directly is the narrow fix.
    //
    // The path is derived by the same upward walk every other path in this
    // build uses (gradle.ext.nodeModules, settings.gradle), so it holds
    // whether the dependency is hoisted or not. %OS-BIN% is left for the
    // plugin to substitute, which is what lets one line serve a developer's
    // mac and CI's linux; only Windows would need more, and nothing in this
    // repository builds there.
    hermesCommand = new File(nodeModuleDir("hermes-compiler"), "hermesc/%OS-BIN%/hermesc").toString()
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Read once, and assigned rather than written inline: `versionCode (x) as
// Integer` parses as `(versionCode(x)) as Integer` in Groovy, which passes a
// string to the setter and casts the wrong thing.
def messagrVersionCode = (System.getenv("MESSAGR_VERSION_CODE") ?: "1").toInteger()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // eu.messagr, the reverse-DNS of messagr.eu, which this project owns and
    // which serves the application's own site and its production homeserver.
    //
    // The template left com.messagr, which claims a namespace belonging to a
    // domain nobody here holds, and the application already contradicted it:
    // its keychain entries have always been eu.messagr.session and
    // eu.messagr.crypto-store. A package name is permanent from the first
    // publication, so this was the last moment it could be corrected for
    // nothing.
    namespace "eu.messagr"
    defaultConfig {
        applicationId "eu.messagr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ONE UPLOAD, ONE CODE, AND PLAY NEVER FORGETS ONE.
        //
        // A version code can be used exactly once for an application, for
        // ever: Play refuses a second upload carrying a code it has already
        // seen, and the refusal comes at the end of a build rather than at
        // the start. A constant here means the first upload works and every
        // one after it is rejected.
        //
        // Supplied by whoever is publishing, so the number comes from
        // something that only goes up. The default is for local builds,
        // which never reach a store.
        versionCode messagrVersionCode
        versionName "1.0"

        // Detox drives the app through an instrumentation test, so the app
        // has to declare a runner and be told which build type the test
        // variant should be built against.
        testBuildType System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // THE UPLOAD KEY, WHICH IS NEVER IN THIS REPOSITORY.
        //
        // Play App Signing: the store holds the app signing key, the one an
        // application's identity is permanently bound to. This is the upload
        // key, which only proves that a build came from us. That split is the
        // whole reason it is replaceable at all -- losing the app signing key
        // would end the application, losing this one is a support request.
        //
        // Supplied through the environment, so it lives in the
        // continuous-integration secret store and on whichever machine a
        // person publishes from. The same discipline the bench credentials
        // already follow.
        upload {
            def keystore = System.getenv("MESSAGR_UPLOAD_KEYSTORE")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("MESSAGR_UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MESSAGR_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("MESSAGR_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Unsigned when no upload key is supplied, and deliberately not
            // signed with the debug key the template reached for. A release
            // build carrying the debug signature is one that installs, looks
            // finished, and can never be published under this identity --
            // the framework's own comment warns about exactly that, and the
            // warning was still standing here.
            //
            // An unsigned release still builds, which is what continuous
            // integration needs to inspect the bundle. It simply cannot be
            // installed, which is correct: nothing should be installable
            // from a build nobody signed.
            signingConfig System.getenv("MESSAGR_UPLOAD_KEYSTORE") ? signingConfigs.upload : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    androidTestImplementation 'com.wix:detox:20.51.4'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
